<VirtualHost *:80>
    ServerName domainanda.com
    ServerAlias www.domainanda.com

    ProxyPreserveHost On
    ProxyRequests Off

    # Dukungan WebSocket untuk Next.js (misal HMR / Server-Sent Events)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3000/$1" [P,L]

    # Meneruskan seluruh traffic ke port Next.js
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Meneruskan informasi IP asli pengunjung
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    ErrorLog ${APACHE_LOG_DIR}/nextjs_error.log
    CustomLog ${APACHE_LOG_DIR}/nextjs_access.log combined
</VirtualHost>